version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  SNES9X_HOST: vendor/snes9x_libretro.dylib
  SUPAFAUST_HOST: vendor/mednafen_supafaust_libretro.dylib
  PCSX_HOST: vendor/pcsx_rearmed_libretro.dylib
  GAMBATTE_HOST: vendor/gambatte_libretro.dylib
  PICODRIVE_HOST: vendor/picodrive_libretro.dylib
  GPGX_HOST: vendor/genesis_plus_gx_libretro.dylib
  FCEUMM_HOST: vendor/fceumm_libretro.dylib
  NESTOPIA_HOST: vendor/nestopia_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  ARMGBA_COMMIT: 9847d41da663ebee7839874c34ebde26f0df1e03
  SNES9X_COMMIT: fae2fea08f74180759ef540ee94259213f503480
  SUPAFAUST_COMMIT: 642d1d1b6684aa7e306a02a89885f3f5456a5157
  PCSX_COMMIT: c8816799b50388e61cfe237fe2cdbb7d8175f20a
  GAMBATTE_COMMIT: d9d6cd06382d1ced30de34d56d3609452323dab1
  PICODRIVE_COMMIT: 1890c2932234c9d30f4cd3851d02228baae8f09e
  GPGX_COMMIT: 60bee4c724859710ce05672239e5b601ad01382e
  FCEUMM_COMMIT: ac0d00a7fc01166f84c7bac01d1084ebfd2b865e
  NESTOPIA_COMMIT: 2110d21b7174455ec98948bb474147dea0e3cad0
  # DSperate is no libretro core: the DS games are handed over to it, System/dsperate/dsperate
  DSPERATE_COMMIT: e04b806b5c01527b08a8e7181476ada57e97db52
  # The mali-fbdev SDL2 DSperate draws to fb0 through (BaseOS's own cannot reach the panel), and
  # the libsamplerate it needs, taken from a spruceOS checkout, which builds them for the H700
  SPRUCE: '{{.SPRUCE | default "../spruceOS"}}'
  # Files for the card beyond the build (Overlays/, Config/...), copied over dist-device
  SD_EXTRAS: '{{.SD_EXTRAS | default "../sd-extras"}}'
  # ScreenScraper's developer key for the device build, a shell file exporting OMEGA_SS_DEVID and
  # OMEGA_SS_DEVPASSWORD, which build.rs masks into the binary. Never committed
  SS_ENV: '{{.SS_ENV | default (print .HOME "/.config/emellie-slot/screenscraper.env")}}'
  # The libretro names of the cores the device bundle ships, <name>_libretro.so in System/
  DEVICE_CORES: >-
    mgba armgba snes9x mednafen_supafaust pcsx_rearmed gambatte picodrive genesis_plus_gx fceumm
    nestopia
  # The cores built by cores/<name>/build.sh whose source archive ships in System/licenses/
  # beside them, as <name>:<libretro name>
  SOURCE_CORES: >-
    armgba:armgba snes9x:snes9x supafaust:mednafen_supafaust pcsx_rearmed:pcsx_rearmed
    gambatte-libretro:gambatte picodrive:picodrive Genesis-Plus-GX:genesis_plus_gx
    libretro-fceumm:fceumm nestopia:nestopia

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p omega-zero

  test:
    desc: Run the whole test suite
    cmds:
      - cargo test --workspace --no-fail-fast

  test:timing:
    desc: >-
      Run the emulator's worker tests, which run against real time and so need a quiet
      machine: a shared CI runner skips them
    cmds:
      - cargo test -p omega-zero --test emu -- --ignored

  test:canvases:
    desc: >-
      Run the whole test suite again on every canvas but the default 720x480 one. The square
      720x720 canvas joins once the RG CubeXX layout lands
    cmds:
      - OMEGA_CANVAS=640x480 cargo test --workspace --no-fail-fast

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    cmds:
      - cargo test --workspace --no-fail-fast {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p omega-zero --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:timing
      - task: test:canvases
      - task: test:card

  test:card:
    desc: Test the scripts omega-zero ships on the card, off-device
    cmds:
      - sh card/test-link.sh
      - sh card/test-led.sh
      - sh card/test-coresave.sh
      - sh card/test-probe.sh
      - sh card/test-wifi.sh
      - sh card/test-bluetooth.sh
      - sh card/test-handoff.sh
      - sh card/test-ports.sh
      - sh card/test-pico8.sh
      - sh card/test-lid.sh

  screens:
    desc: >-
      Draw omega-zero's main screens headless into OUT, defaults to target/screens. Run it with
      OUT=target/screens-baseline before a change and screens:compare after it
    vars:
      OUT: '{{.OUT | default "target/screens"}}'
    cmds:
      - cargo run -q --release --example screens -p omega-zero -- {{.OUT}}

  screens:compare:
    desc: Draw the screens again and fail on any pixel that differs from BASELINE, defaults to target/screens-baseline
    vars:
      OUT: '{{.OUT | default "target/screens"}}'
      BASELINE: '{{.BASELINE | default "target/screens-baseline"}}'
    cmds:
      - cargo run -q --release --example screens -p omega-zero -- {{.OUT}} {{.BASELINE}}

  core:
    desc: >-
      Build mGBA and Supafaust and fetch Snes9x, pcsx_rearmed, Gambatte, PicoDrive,
      Genesis Plus GX, FCEUmm and Nestopia for this host. A missing core silently runs the mock
      (a test pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:snes9x:host
      - task: core:supafaust:host
      - task: core:pcsx:host
      - task: core:gambatte:host
      - task: core:buildbot
        vars: {LIB: picodrive}
      - task: core:buildbot
        vars: {LIB: genesis_plus_gx}
      - task: core:buildbot
        vars: {LIB: fceumm}
      - task: core:buildbot
        vars: {LIB: nestopia}

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:snes9x:host:
    desc: Fetch the host Snes9x core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: snes9x}

  core:pcsx:host:
    desc: Fetch the host pcsx_rearmed core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: pcsx_rearmed}

  core:gambatte:host:
    desc: Fetch the host Gambatte core from the libretro buildbot
    cmds:
      - task: core:buildbot
        vars: {LIB: gambatte}

  core:supafaust:host:
    desc: >-
      Build Supafaust for this host from its pinned source archive and cores/supafaust's patches.
      The libretro buildbot builds none for macOS
    status:
      - test -f {{.SUPAFAUST_HOST}}
      - test "$(cat vendor/supafaust-src.sha 2>/dev/null)" = "{{.SUPAFAUST_COMMIT}}"
      - test "$(cat {{.SUPAFAUST_HOST}}.meta 2>/dev/null)" = "$(sh cores/supafaust/build.sh stamp {{.SUPAFAUST_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: supafaust, COMMIT: '{{.SUPAFAUST_COMMIT}}', FILE: Makefile}
      - >-
        sh cores/supafaust/build.sh build {{.SUPAFAUST_COMMIT}} vendor/supafaust-src.tar.gz
        target/supafaust {{.SUPAFAUST_HOST}}
      - file {{.SUPAFAUST_HOST}} | grep -q Mach-O
      - 'echo "built {{.SUPAFAUST_HOST}}"'

  core:buildbot:
    desc: Fetch LIB's core for this Mac from the libretro buildbot's nightlies
    internal: true
    requires:
      vars: [LIB]
    status:
      - test -f vendor/{{.LIB}}_libretro.dylib
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/{{.LIB}}-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/{{.LIB}}_libretro.dylib.zip"
        unzip -o -q vendor/{{.LIB}}-host.zip -d vendor
        rm -f vendor/{{.LIB}}-host.zip
        file vendor/{{.LIB}}_libretro.dylib | grep -q Mach-O
        echo "fetched vendor/{{.LIB}}_libretro.dylib"

  core:src:
    desc: >-
      Fetch libretro/NAME's source archive at COMMIT into vendor/NAME-src.tar.gz, checking it
      holds FILE, and note the commit beside it in vendor/NAME-src.sha
    internal: true
    run: when_changed
    requires:
      vars: [NAME, COMMIT, FILE]
    status:
      - test -f vendor/{{.NAME}}-src.tar.gz
      - test "$(cat vendor/{{.NAME}}-src.sha 2>/dev/null)" = "{{.COMMIT}}"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/{{.NAME}}-src.tar.gz vendor/{{.NAME}}-src.sha
        curl -fsSL -o vendor/{{.NAME}}-src.tar.gz \
          "https://github.com/libretro/{{.NAME}}/archive/{{.COMMIT}}.tar.gz"
        tar -tzf vendor/{{.NAME}}-src.tar.gz | grep "^{{.NAME}}-{{.COMMIT}}/{{.FILE}}$" > /dev/null
        echo "{{.COMMIT}}" > vendor/{{.NAME}}-src.sha

  core:src:git:
    desc: >-
      core:src for a core whose source has submodules, which GitHub's archive leaves out:
      libretro/NAME cloned at COMMIT with them, packed as NAME-COMMIT/ the way an archive is
    internal: true
    run: when_changed
    requires:
      vars: [NAME, COMMIT, FILE]
    status:
      - test -f vendor/{{.NAME}}-src.tar.gz
      - test "$(cat vendor/{{.NAME}}-src.sha 2>/dev/null)" = "{{.COMMIT}}"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/{{.NAME}}-src.tar.gz vendor/{{.NAME}}-src.sha
        vendor="$PWD/vendor"
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        git init -q "$work/{{.NAME}}-{{.COMMIT}}"
        cd "$work/{{.NAME}}-{{.COMMIT}}"
        git fetch -q --depth 1 "https://github.com/libretro/{{.NAME}}.git" {{.COMMIT}}
        git checkout -q FETCH_HEAD
        git submodule -q update --init --recursive --depth 1
        test -f {{.FILE}}
        cd "$work"
        find "{{.NAME}}-{{.COMMIT}}" -name .git -prune -o -print | LC_ALL=C sort |
          tar --no-recursion --mtime=@0 --owner=0 --group=0 -cf - -T - | gzip -n \
          > "$vendor/{{.NAME}}-src.tar.gz"
        echo "{{.COMMIT}}" > "$vendor/{{.NAME}}-src.sha"

  core:update:
    desc: >-
      Rebuild mGBA and Supafaust and re-fetch Snes9x and pcsx_rearmed for this host even
      if they are already vendored
    cmds:
      - >-
        rm -f {{.CORE}} {{.CORE}}.meta {{.SNES9X_HOST}} {{.SUPAFAUST_HOST}}
        {{.SUPAFAUST_HOST}}.meta {{.PCSX_HOST}} {{.GAMBATTE_HOST}} {{.PICODRIVE_HOST}}
        {{.GPGX_HOST}} {{.FCEUMM_HOST}} {{.NESTOPIA_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/omega-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  bootlogos:
    desc: >-
      Render the boot images in card/System, one per panel: an old PC's BIOS screen after
      Award's, in the opening's letters, with the logo assets/logo/bioslogo.sh made (run it again
      after the logo changes; it needs ImageMagick)
    cmds:
      - cargo run -q -p omega-zero --example bootscreens -- card/System

  bootlogos:logo:
    desc: >-
      Render the boot images in card/System as they were before the BIOS screen: the logo from
      assets/logo/omega-zero-logo.html over the shelf's grid, one per panel so the grid stays
      whole. STYLE=smooth for the drawn-straight version instead of pixel art (needs Google
      Chrome and ImageMagick)
    vars:
      STYLE: '{{.STYLE | default "pixel"}}'
      LOGO_WIDTH: 414
    cmds:
      - |
        set -euo pipefail
        for size in 640x480 720x480 720x720; do
          assets/logo/bootlogo.sh {{.STYLE}} "${size%x*}" "${size#*x}" "card/System/bootlogo-$size.bmp" {{.LOGO_WIDTH}}
        done

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/emellie-slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/GBA, Games/GB or Games/GBC, labels in the matching Labels/GBA, Labels/GB or Labels/GBC, battery saves in the matching Saves/GBA, Saves/GB or Saves/GBC, save states under the matching States/GBA, States/GB or States/GBC, gba_bios.bin in BIOS, pngs in Wallpapers, palette in Config/theme.txt, overlays in Overlays/GBA, Overlays/GB or Overlays/GBC named for the canvas, eg 640x480.png"'
      - 'echo "nothing is moved for you: a file loose at the top of Games/, Saves/, Labels/ or States/ is left where it is and never reaches the shelf"'

  run:
    desc: >-
      Run omega-zero against OMEGA_ROOT, defaults to ./sdcard. OMEGA_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p omega-zero

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
      OMEGA_BARE: '1'
    cmds:
      - cargo run --release -p omega-zero

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      OMEGA_ROOT: '{{.OMEGA_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p omega-zero

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [core, release]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/emellie-slot --init-root {{.OUT}}
      - cp target/release/emellie-slot {{.OUT}}/System/emellie-slot
      - >-
        cp {{.CORE}} {{.SNES9X_HOST}} {{.SUPAFAUST_HOST}} {{.PCSX_HOST}}
        {{.GAMBATTE_HOST}} {{.PICODRIVE_HOST}} {{.GPGX_HOST}} {{.FCEUMM_HOST}} {{.NESTOPIA_HOST}}
        {{.OUT}}/System/
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:armgba:
    desc: >-
      Build the aarch64 linux armGBA core, the GBA's default, from its pinned source archive,
      which ships beside it: GPL-2.0 as a whole, as it links Gambatte; its own parts are MPL-2.0
    status:
      - test -f vendor/armgba_libretro.so
      - test "$(cat vendor/armgba-src.sha 2>/dev/null)" = "{{.ARMGBA_COMMIT}}"
      - test "$(cat vendor/armgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/armgba/build.sh stamp {{.ARMGBA_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        if [ "$(cat vendor/armgba-src.sha 2>/dev/null)" != "{{.ARMGBA_COMMIT}}" ]; then
          rm -f vendor/armgba-src.tar.gz vendor/armgba-src.sha
          curl -fsSL -o vendor/armgba-src.tar.gz \
            "https://github.com/Jacob-Matthew-Cook/armGBA/archive/{{.ARMGBA_COMMIT}}.tar.gz"
          tar -tzf vendor/armgba-src.tar.gz | grep "^armGBA-{{.ARMGBA_COMMIT}}/libretro/libretro.c$" > /dev/null
          echo "{{.ARMGBA_COMMIT}}" > vendor/armgba-src.sha
        fi
      - task: device:sh
        vars:
          CMD: >-
            sh cores/dsperate/apt.sh cmake zlib1g-dev &&
            sh cores/armgba/build.sh build {{.ARMGBA_COMMIT}} vendor/armgba-src.tar.gz
            target-device/armgba vendor/armgba_libretro.so
      - file vendor/armgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/armgba_libretro.so from vendor/armgba-src.tar.gz @ {{.ARMGBA_COMMIT}}"'

  core:armgba:update:
    desc: Refetch armGBA's source archive and rebuild the core from it, even if the set is current
    cmds:
      - rm -f vendor/armgba_libretro.so vendor/armgba_libretro.so.meta vendor/armgba-src.tar.gz vendor/armgba-src.sha
      - task: core:armgba

  core:snes9x:
    desc: >-
      Build the aarch64 linux Snes9x core from its pinned source archive. Its licence allows
      non-commercial use only; the archive ships beside it for the LGPL-2.1 NTSC filter inside
    status:
      - test -f vendor/snes9x_libretro.so
      - test "$(cat vendor/snes9x-src.sha 2>/dev/null)" = "{{.SNES9X_COMMIT}}"
      - test "$(cat vendor/snes9x_libretro.so.meta 2>/dev/null)" = "$(sh cores/snes9x/build.sh stamp {{.SNES9X_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: snes9x, COMMIT: '{{.SNES9X_COMMIT}}', FILE: libretro/Makefile}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/snes9x/build.sh build {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz
            target-device/snes9x vendor/snes9x_libretro.so
      - file vendor/snes9x_libretro.so | grep -q aarch64
      - 'echo "built vendor/snes9x_libretro.so from vendor/snes9x-src.tar.gz @ {{.SNES9X_COMMIT}}"'

  core:gambatte:
    desc: >-
      Build the aarch64 linux Gambatte core, the Game Boys' default, from its pinned source
      archive. GPL-2.0; the archive ships beside it
    status:
      - test -f vendor/gambatte_libretro.so
      - test "$(cat vendor/gambatte-libretro-src.sha 2>/dev/null)" = "{{.GAMBATTE_COMMIT}}"
      - test "$(cat vendor/gambatte_libretro.so.meta 2>/dev/null)" = "$(sh cores/gambatte/build.sh stamp {{.GAMBATTE_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: gambatte-libretro, COMMIT: '{{.GAMBATTE_COMMIT}}', FILE: Makefile.libretro}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gambatte/build.sh build {{.GAMBATTE_COMMIT}} vendor/gambatte-libretro-src.tar.gz
            target-device/gambatte vendor/gambatte_libretro.so
      - file vendor/gambatte_libretro.so | grep -q aarch64
      - 'echo "built vendor/gambatte_libretro.so from vendor/gambatte-libretro-src.tar.gz @ {{.GAMBATTE_COMMIT}}"'

  core:gambatte:update:
    desc: Refetch Gambatte's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/gambatte_libretro.so vendor/gambatte_libretro.so.meta vendor/gambatte-libretro-src.tar.gz vendor/gambatte-libretro-src.sha
      - task: core:gambatte

  core:picodrive:
    desc: >-
      Build the aarch64 linux PicoDrive core, the Mega Drive's default, from its pinned source
      with its submodules. Non-commercial use only; the source ships beside it
    status:
      - test -f vendor/picodrive_libretro.so
      - test "$(cat vendor/picodrive-src.sha 2>/dev/null)" = "{{.PICODRIVE_COMMIT}}"
      - test "$(cat vendor/picodrive_libretro.so.meta 2>/dev/null)" = "$(sh cores/picodrive/build.sh stamp {{.PICODRIVE_COMMIT}})"
    cmds:
      - task: core:src:git
        vars: {NAME: picodrive, COMMIT: '{{.PICODRIVE_COMMIT}}', FILE: Makefile.libretro}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/picodrive/build.sh build {{.PICODRIVE_COMMIT}} vendor/picodrive-src.tar.gz
            target-device/picodrive vendor/picodrive_libretro.so
      - file vendor/picodrive_libretro.so | grep -q aarch64
      - 'echo "built vendor/picodrive_libretro.so from vendor/picodrive-src.tar.gz @ {{.PICODRIVE_COMMIT}}"'

  core:picodrive:update:
    desc: Refetch PicoDrive's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/picodrive_libretro.so vendor/picodrive_libretro.so.meta vendor/picodrive-src.tar.gz vendor/picodrive-src.sha
      - task: core:picodrive

  core:gpgx:
    desc: >-
      Build the aarch64 linux Genesis Plus GX core, the Mega Drive's second, from its pinned
      source archive. Non-commercial use only; the archive ships beside it
    status:
      - test -f vendor/genesis_plus_gx_libretro.so
      - test "$(cat vendor/Genesis-Plus-GX-src.sha 2>/dev/null)" = "{{.GPGX_COMMIT}}"
      - test "$(cat vendor/genesis_plus_gx_libretro.so.meta 2>/dev/null)" = "$(sh cores/genesis_plus_gx/build.sh stamp {{.GPGX_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: Genesis-Plus-GX, COMMIT: '{{.GPGX_COMMIT}}', FILE: Makefile.libretro}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/genesis_plus_gx/build.sh build {{.GPGX_COMMIT}} vendor/Genesis-Plus-GX-src.tar.gz
            target-device/genesis_plus_gx vendor/genesis_plus_gx_libretro.so
      - file vendor/genesis_plus_gx_libretro.so | grep -q aarch64
      - 'echo "built vendor/genesis_plus_gx_libretro.so from vendor/Genesis-Plus-GX-src.tar.gz @ {{.GPGX_COMMIT}}"'

  core:gpgx:update:
    desc: Refetch Genesis Plus GX's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/genesis_plus_gx_libretro.so vendor/genesis_plus_gx_libretro.so.meta vendor/Genesis-Plus-GX-src.tar.gz vendor/Genesis-Plus-GX-src.sha
      - task: core:gpgx

  core:fceumm:
    desc: >-
      Build the aarch64 linux FCEUmm core, the NES's default, from its pinned source archive.
      GPL-2.0; the archive ships beside it
    status:
      - test -f vendor/fceumm_libretro.so
      - test "$(cat vendor/libretro-fceumm-src.sha 2>/dev/null)" = "{{.FCEUMM_COMMIT}}"
      - test "$(cat vendor/fceumm_libretro.so.meta 2>/dev/null)" = "$(sh cores/fceumm/build.sh stamp {{.FCEUMM_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: libretro-fceumm, COMMIT: '{{.FCEUMM_COMMIT}}', FILE: Makefile.libretro}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/fceumm/build.sh build {{.FCEUMM_COMMIT}} vendor/libretro-fceumm-src.tar.gz
            target-device/fceumm vendor/fceumm_libretro.so
      - file vendor/fceumm_libretro.so | grep -q aarch64
      - 'echo "built vendor/fceumm_libretro.so from vendor/libretro-fceumm-src.tar.gz @ {{.FCEUMM_COMMIT}}"'

  core:fceumm:update:
    desc: Refetch FCEUmm's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/fceumm_libretro.so vendor/fceumm_libretro.so.meta vendor/libretro-fceumm-src.tar.gz vendor/libretro-fceumm-src.sha
      - task: core:fceumm

  core:nestopia:
    desc: >-
      Build the aarch64 linux Nestopia UE core, the NES's second, from its pinned source
      archive. GPL-2.0; the archive ships beside it
    status:
      - test -f vendor/nestopia_libretro.so
      - test "$(cat vendor/nestopia-src.sha 2>/dev/null)" = "{{.NESTOPIA_COMMIT}}"
      - test "$(cat vendor/nestopia_libretro.so.meta 2>/dev/null)" = "$(sh cores/nestopia/build.sh stamp {{.NESTOPIA_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: nestopia, COMMIT: '{{.NESTOPIA_COMMIT}}', FILE: libretro/Makefile}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/nestopia/build.sh build {{.NESTOPIA_COMMIT}} vendor/nestopia-src.tar.gz
            target-device/nestopia vendor/nestopia_libretro.so
      - file vendor/nestopia_libretro.so | grep -q aarch64
      - 'echo "built vendor/nestopia_libretro.so from vendor/nestopia-src.tar.gz @ {{.NESTOPIA_COMMIT}}"'

  core:nestopia:update:
    desc: Refetch Nestopia's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/nestopia_libretro.so vendor/nestopia_libretro.so.meta vendor/nestopia-src.tar.gz vendor/nestopia-src.sha
      - task: core:nestopia

  core:snes9x:update:
    desc: Refetch Snes9x's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - rm -f vendor/snes9x_libretro.so vendor/snes9x_libretro.so.meta vendor/snes9x-src.tar.gz vendor/snes9x-src.sha
      - task: core:snes9x

  core:supafaust:
    desc: >-
      Build the aarch64 linux Supafaust core from its pinned source archive, which ships beside
      it as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/mednafen_supafaust_libretro.so
      - test "$(cat vendor/supafaust-src.sha 2>/dev/null)" = "{{.SUPAFAUST_COMMIT}}"
      - test "$(cat vendor/mednafen_supafaust_libretro.so.meta 2>/dev/null)" = "$(sh cores/supafaust/build.sh stamp {{.SUPAFAUST_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: supafaust, COMMIT: '{{.SUPAFAUST_COMMIT}}', FILE: Makefile}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/supafaust/build.sh build {{.SUPAFAUST_COMMIT}} vendor/supafaust-src.tar.gz
            target-device/supafaust vendor/mednafen_supafaust_libretro.so
      - file vendor/mednafen_supafaust_libretro.so | grep -q aarch64
      - >-
        echo "built vendor/mednafen_supafaust_libretro.so from vendor/supafaust-src.tar.gz @
        {{.SUPAFAUST_COMMIT}}"

  core:supafaust:update:
    desc: Refetch Supafaust's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/mednafen_supafaust_libretro.so vendor/mednafen_supafaust_libretro.so.meta
        vendor/supafaust-src.tar.gz vendor/supafaust-src.sha
      - task: core:supafaust

  core:pcsx:
    desc: >-
      Build the aarch64 linux pcsx_rearmed core, with its ARM64 dynarec and NEON GPU, from its
      pinned source archive, which ships beside it as its GPL-2.0 section 3(a) corresponding
      source
    status:
      - test -f vendor/pcsx_rearmed_libretro.so
      - test "$(cat vendor/pcsx_rearmed-src.sha 2>/dev/null)" = "{{.PCSX_COMMIT}}"
      - test "$(cat vendor/pcsx_rearmed_libretro.so.meta 2>/dev/null)" = "$(sh cores/pcsx_rearmed/build.sh stamp {{.PCSX_COMMIT}})"
    cmds:
      - task: core:src
        vars: {NAME: pcsx_rearmed, COMMIT: '{{.PCSX_COMMIT}}', FILE: Makefile.libretro}
      - task: device:sh
        vars:
          CMD: >-
            sh cores/pcsx_rearmed/build.sh build {{.PCSX_COMMIT}} vendor/pcsx_rearmed-src.tar.gz
            target-device/pcsx_rearmed vendor/pcsx_rearmed_libretro.so
      - file vendor/pcsx_rearmed_libretro.so | grep -q aarch64
      - >-
        echo "built vendor/pcsx_rearmed_libretro.so from vendor/pcsx_rearmed-src.tar.gz @
        {{.PCSX_COMMIT}}"

  core:pcsx:update:
    desc: Refetch pcsx_rearmed's source archive and rebuild the device core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/pcsx_rearmed_libretro.so vendor/pcsx_rearmed_libretro.so.meta
        vendor/pcsx_rearmed-src.tar.gz vendor/pcsx_rearmed-src.sha
      - task: core:pcsx

  core:dsperate:
    desc: >-
      Build the aarch64 DSperate the DS games are handed over to, from its pinned source archive,
      which ships beside it as its GPL-3.0 corresponding source, and stage the mali-fbdev SDL2 it
      draws through from SPRUCE (a spruceOS checkout, ../spruceOS by default)
    status:
      - test -f vendor/dsperate
      - test -f vendor/dsperate-lib/libSDL2-2.0.so.0
      - test -f vendor/dsperate-lib/libsamplerate.so.0
      - test "$(cat vendor/DSperate-src.sha 2>/dev/null)" = "{{.DSPERATE_COMMIT}}"
      - test "$(cat vendor/dsperate.meta 2>/dev/null)" = "$(sh cores/dsperate/build.sh stamp {{.DSPERATE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        if [ "$(cat vendor/DSperate-src.sha 2>/dev/null)" != "{{.DSPERATE_COMMIT}}" ]; then
          rm -f vendor/DSperate-src.tar.gz vendor/DSperate-src.sha
          curl -fsSL -o vendor/DSperate-src.tar.gz \
            "https://github.com/beebono/DSperate/archive/{{.DSPERATE_COMMIT}}.tar.gz"
          tar -tzf vendor/DSperate-src.tar.gz | grep "^DSperate-{{.DSPERATE_COMMIT}}/CMakeLists.txt$" > /dev/null
          echo "{{.DSPERATE_COMMIT}}" > vendor/DSperate-src.sha
        fi
      - task: device:sh
        vars:
          CMD: >-
            sh cores/dsperate/apt.sh cmake ninja-build pkg-config libsdl2-dev &&
            sh cores/dsperate/build.sh build {{.DSPERATE_COMMIT}} vendor/DSperate-src.tar.gz
            target-device/dsperate vendor/dsperate
      - file vendor/dsperate | grep -q aarch64
      - |
        set -euo pipefail
        mali="{{.SPRUCE}}/App/PyUI/dll-mali"
        test -f "$mali/libSDL2-2.0.so.0" || { echo "no mali SDL2 at $mali, set SPRUCE to a spruceOS checkout" >&2; exit 1; }
        mkdir -p vendor/dsperate-lib
        cp "$mali/libSDL2-2.0.so.0" "$mali/libsamplerate.so.0" vendor/dsperate-lib/
        file vendor/dsperate-lib/libSDL2-2.0.so.0 | grep -q aarch64
      - 'echo "built vendor/dsperate from vendor/DSperate-src.tar.gz @ {{.DSPERATE_COMMIT}}"'

  core:dsperate:update:
    desc: Refetch DSperate's source archive and rebuild it, even if the set is current
    cmds:
      - rm -rf vendor/dsperate vendor/dsperate.meta vendor/dsperate-lib vendor/DSperate-src.tar.gz vendor/DSperate-src.sha
      - task: core:dsperate

  vendor:portmaster:
    desc: >-
      Stage what System/ports.sh runs PortMaster and its ports with, from SPRUCE (a spruceOS
      checkout, ../spruceOS by default): spruceOS's PortMaster bundle with its Python, the static
      7-Zip from inside it that lays the bundle out on the card, a static bash (BaseOS has none),
      the mali SDL2 set PortMaster draws through and the vendor SDL2 keyboard-driven ports want
    status:
      - test -f vendor/portmaster/portmaster.7z
      - test -f vendor/portmaster/bin/7zzs
      - test -f vendor/portmaster/bin/bash
      - test -f vendor/portmaster/lib/libSDL2-2.0.so.0
      - test -f vendor/portmaster/lib/libSDL2_ttf-2.0.so.0
      - test -f vendor/portmaster/sdl2/libSDL2-2.0.so.0
      - cmp -s vendor/portmaster/portmaster.7z "{{.SPRUCE}}/App/PortMaster/portmaster.7z"
    cmds:
      - |
        set -euo pipefail
        spruce="{{.SPRUCE}}"
        test -f "$spruce/App/PortMaster/portmaster.7z" \
          || { echo "no PortMaster bundle in $spruce, set SPRUCE to a spruceOS checkout" >&2; exit 1; }
        command -v 7z > /dev/null || { echo "7z (p7zip or 7-Zip) is needed to read the bundle" >&2; exit 1; }
        rm -rf vendor/portmaster
        mkdir -p vendor/portmaster/bin vendor/portmaster/lib vendor/portmaster/sdl2
        cp "$spruce/App/PortMaster/portmaster.7z" vendor/portmaster/
        7z e -so vendor/portmaster/portmaster.7z portmaster/PortMaster/7zzs.aarch64 > vendor/portmaster/bin/7zzs
        cp "$spruce/spruce/smartpro/bin/bash" vendor/portmaster/bin/bash
        cp "$spruce"/App/PyUI/dll-mali/* vendor/portmaster/lib/
        # the add-ons come only by their link names; sdl2imgshow and ports ask by soname
        for lib in SDL2_gfx-1.0 SDL2_image-2.0 SDL2_mixer-2.0 SDL2_ttf-2.0; do
          cp "vendor/portmaster/lib/lib$lib.so" "vendor/portmaster/lib/lib$lib.so.0"
        done
        cp "$spruce/spruce/h700/lib64/sdl2/libSDL2-2.0.so.0" vendor/portmaster/sdl2/
        file vendor/portmaster/bin/7zzs | grep -q 'aarch64.*statically linked'
        file vendor/portmaster/bin/bash | grep -q 'aarch64.*statically linked'
        file vendor/portmaster/lib/libSDL2-2.0.so.0 | grep -q aarch64
      - 'echo "staged vendor/portmaster from {{.SPRUCE}}"'

  vendor:pico8:
    desc: >-
      Build the shim System/pico8.sh preloads under PICO-8, which keeps it from asking the mali
      SDL2 for the sensors it was built without (cores/pico8/sdl-sensor-shim.c)
    sources:
      - cores/pico8/sdl-sensor-shim.c
    generates:
      - vendor/pico8/libsdl_sensor_shim.so
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            mkdir -p vendor/pico8 &&
            cc -shared -fPIC -O2 -o vendor/pico8/libsdl_sensor_shim.so cores/pico8/sdl-sensor-shim.c -ldl
      - file vendor/pico8/libsdl_sensor_shim.so | grep -q aarch64

  cores:device:
    desc: >-
      Build every core the device bundle ships, mGBA, armGBA, Snes9x, Supafaust, pcsx_rearmed,
      Gambatte, PicoDrive, Genesis Plus GX, FCEUmm, Nestopia and DSperate
    deps:
      - core:device
      - core:armgba
      - core:snes9x
      - core:supafaust
      - core:pcsx
      - core:gambatte
      - core:picodrive
      - core:gpgx
      - core:fceumm
      - core:nestopia
      - core:dsperate

  device:sh:
    desc: >-
      Run CMD on the box the device build wants, fetching one if this is not it. The container
      keeps the pinned toolchain and the crates it downloads in two docker volumes, so a build
      does not fetch them all again. On a Linux host the container's root would own what it
      writes into the checkout, so whatever it leaves there is handed back to the user running it
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - |
        set -eu
        # ScreenScraper's developer key, from SS_ENV unless already exported
        if [ -z "${OMEGA_SS_DEVID:-}" ] && [ -f "{{.SS_ENV}}" ]; then
          set -a; . "{{.SS_ENV}}"; set +a
        fi
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm --platform linux/arm64 -e OMEGA_SS_DEVID -e OMEGA_SS_DEVPASSWORD \
            -e HOST_ID="$(id -u):$(id -g)" \
            -v omega-zero-rustup:/usr/local/rustup -v omega-zero-cargo:/usr/local/cargo/registry \
            -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}
            status=$?
            find /src -xdev -user 0 -exec chown "$HOST_ID" {} + 2>/dev/null
            exit $status'
        fi

  build:device:
    desc: >-
      Build for the H700, in an arm64 container unless this is already one. PROFILE=device-dev
      skips the release build's whole-program optimisation, for a build in seconds while trying
      a change on the console
    vars:
      PROFILE: '{{.PROFILE | default "device"}}'
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile {{.PROFILE}} --target-dir target-device
            -p omega-zero --no-default-features --features device
      - file target-device/{{.PROFILE}}/emellie-slot | grep -q aarch64
      - 'echo "built target-device/{{.PROFILE}}/emellie-slot"'

  bench:device:
    desc: Build core_bench, omega-retro's headless core benchmark, for the H700. It never ships
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p omega-retro --example core_bench
      - file target-device/device/examples/core_bench | grep -q aarch64
      - 'echo "built target-device/device/examples/core_bench, adb push it to /tmp/core_bench"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    deps: [cores:device, build:device, vendor:portmaster, vendor:pico8]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          CMD: ./target-device/device/emellie-slot --init-root {{.OUT}}
      - cp target-device/device/emellie-slot {{.OUT}}/System/emellie-slot
      - cp -R card/System/. {{.OUT}}/System/
      - |
        set -eu
        file vendor/dsperate | grep -q aarch64
        mkdir -p {{.OUT}}/System/dsperate/lib
        cp vendor/dsperate {{.OUT}}/System/dsperate/dsperate
        cp vendor/dsperate-lib/* {{.OUT}}/System/dsperate/lib/
      - |
        set -eu
        # PortMaster, laid out on the card from its bundle by System/ports.sh the first time
        mkdir -p {{.OUT}}/System/ports/bin {{.OUT}}/System/ports/lib {{.OUT}}/System/ports/sdl2
        cp vendor/portmaster/portmaster.7z {{.OUT}}/System/ports/
        cp vendor/portmaster/bin/* {{.OUT}}/System/ports/bin/
        cp vendor/portmaster/lib/* {{.OUT}}/System/ports/lib/
        cp vendor/portmaster/sdl2/* {{.OUT}}/System/ports/sdl2/
        # PortMaster on the Ports shelf, which ports.sh runs PortMaster for by its name
        mkdir -p {{.OUT}}/Games/PORTS
        printf '#!/bin/bash\n# PortMaster: Emellie Slot runs it by this name (System/ports.sh)\n' \
          > {{.OUT}}/Games/PORTS/PortMaster.sh
      - |
        set -eu
        # PICO-8 is the player's own, in BIOS/; the shim it is run with, and Splore on its shelf
        cp vendor/pico8/libsdl_sensor_shim.so {{.OUT}}/System/pico8/
        mkdir -p {{.OUT}}/Games/PICO8
        : > {{.OUT}}/Games/PICO8/Splore.splore
      - |
        set -eu
        for lib in {{.DEVICE_CORES}}; do
          file "vendor/${lib}_libretro.so" | grep -q aarch64
          cp "vendor/${lib}_libretro.so" {{.OUT}}/System/
        done
      - cp -r licenses {{.OUT}}/System/licenses
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        # armGBA is GPL-2.0 as a whole (its own parts MPL-2.0); Supafaust, pcsx_rearmed, Gambatte,
        # FCEUmm and Nestopia are GPL-2.0, Snes9x
        # holds the LGPL-2.1 snes_ntsc filter, and PicoDrive and Genesis Plus GX ask for their
        # source: each ships its source archive, build stamp and patches beside it
        for core in {{.SOURCE_CORES}}; do
          name="${core%%:*}" lib="${core#*:}"
          sha="$(cat "vendor/$name-src.sha")"
          cp "vendor/$name-src.tar.gz" "{{.OUT}}/System/licenses/$name-${sha}.tar.gz"
          cp "vendor/${lib}_libretro.so.meta" "{{.OUT}}/System/licenses/$name-${sha}.meta"
          for p in cores/$name/*.patch; do
            [ -f "$p" ] || continue
            cp "$p" "{{.OUT}}/System/licenses/$name-$(basename "$p")"
          done
        done
      - |
        set -euo pipefail
        # DSperate is GPL-3.0: its source archive and build stamp ship beside it
        sha="$(cat vendor/DSperate-src.sha)"
        cp vendor/DSperate-src.tar.gz "{{.OUT}}/System/licenses/DSperate-${sha}.tar.gz"
        cp vendor/dsperate.meta "{{.OUT}}/System/licenses/DSperate-${sha}.meta"
      - |
        set -eu
        # what the card keeps beyond the build, overlays and the like, laid over the tree:
        # SD_EXTRAS, ../sd-extras by default, survives the tree being made again
        extras="{{.SD_EXTRAS}}"
        if [ -d "$extras" ]; then
          cp -R "$extras/." {{.OUT}}/
          echo "added $extras"
        fi
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    deps: [cores:device, build:device, vendor:pico8]
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      - |
        set -eu
        for lib in {{.DEVICE_CORES}}; do
          file "vendor/${lib}_libretro.so" | grep -q aarch64
        done
      - adb push target-device/device/emellie-slot '{{.SD}}/System/emellie-slot'
      - for f in card/System/*; do adb push "$f" '{{.SD}}/System/'; done
      - adb push vendor/dsperate '{{.SD}}/System/dsperate/dsperate'
      - for f in vendor/dsperate-lib/*; do adb push "$f" '{{.SD}}/System/dsperate/lib/'; done
      - adb push vendor/pico8/libsdl_sensor_shim.so '{{.SD}}/System/pico8/'
      - |
        set -euo pipefail
        for lib in {{.DEVICE_CORES}}; do
          adb push "vendor/${lib}_libretro.so" "{{.SD}}/System/${lib}_libretro.so"
        done
      - adb push licenses '{{.SD}}/System/'
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        adb push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        for core in {{.SOURCE_CORES}}; do
          name="${core%%:*}" lib="${core#*:}"
          sha="$(cat "vendor/$name-src.sha")"
          adb push "vendor/$name-src.tar.gz" "{{.SD}}/System/licenses/$name-${sha}.tar.gz"
          adb push "vendor/${lib}_libretro.so.meta" "{{.SD}}/System/licenses/$name-${sha}.meta"
          for p in cores/$name/*.patch; do
            [ -f "$p" ] || continue
            adb push "$p" "{{.SD}}/System/licenses/$name-$(basename "$p")"
          done
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/DSperate-src.sha)"
        adb push vendor/DSperate-src.tar.gz "{{.SD}}/System/licenses/DSperate-${sha}.tar.gz"
        adb push vendor/dsperate.meta "{{.SD}}/System/licenses/DSperate-${sha}.meta"
      - adb shell 'chmod +x {{.SD}}/System/emellie-slot {{.SD}}/System/dsperate/dsperate && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read omega-zero's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/emellie-slot.log'

  deploy:wifi:
    desc: >-
      Build omega-zero and copy it onto a console on the home network over SSH, then reboot it
      into the new build and wait until it starts. CONSOLE defaults to rg35xxsp.local and SD to
      /mnt/sdcard. CONSOLE_PASSWORD defaults to the first line of .console-password at the
      repo's root (git ignores it), else root; the console shows its password under Settings >
      Network, Y on SSH. PROFILE defaults to device-dev, quick to build; PROFILE=device
      copies the shipping build. SCRIPTS=1 copies card/System's scripts too. CORES=1 builds
      the five cores the bundle ships and copies them into System/ too. A game still running
      loses whatever it has not saved
    vars:
      PROFILE: '{{.PROFILE | default "device-dev"}}'
    env:
      CONSOLE: '{{.CONSOLE}}'
      SD: '{{.SD}}'
      CONSOLE_PASSWORD: '{{.CONSOLE_PASSWORD}}'
      CORES: '{{.CORES}}'
      DEVICE_CORES: '{{.DEVICE_CORES}}'
    cmds:
      - task: cores:device
        if: '[ -n "{{.CORES}}" ]'
      - task: build:device
        vars:
          PROFILE: '{{.PROFILE}}'
      - sh scripts/console.sh deploy target-device/{{.PROFILE}}/emellie-slot {{if .SCRIPTS}}card/System/*.sh{{end}}

  log:wifi:
    desc: >-
      Read omega-zero's log off a console on the home network, CONSOLE, SD and CONSOLE_PASSWORD
      (or .console-password) as deploy:wifi
    env:
      CONSOLE: '{{.CONSOLE}}'
      SD: '{{.SD}}'
      CONSOLE_PASSWORD: '{{.CONSOLE_PASSWORD}}'
    cmds:
      - sh scripts/console.sh log

  screenshot:wifi:
    desc: >-
      Save the panel of a console on the home network as it is now, shaders and overlays on it,
      to OUT (default screenshots/<time>.png); CONSOLE, SD and CONSOLE_PASSWORD as deploy:wifi
    env:
      CONSOLE: '{{.CONSOLE}}'
      CONSOLE_PASSWORD: '{{.CONSOLE_PASSWORD}}'
    cmds:
      - sh scripts/console.sh screenshot {{.OUT}}

  clean:

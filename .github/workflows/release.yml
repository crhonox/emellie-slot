name: release

# The card tree, as `task dist:device` makes it on a PC, built on an arm64 runner and zipped. A
# tag (v*) publishes it as a GitHub release; a run by hand only keeps the zip as an artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The spruceOS commit the mali SDL2, libsamplerate, PortMaster's bundle and the static bash
  # come from (taskfile.yml's SPRUCE), only those folders checked out
  SPRUCE_COMMIT: e02f26dfecdb15984933b505d903e8bb318bf82a

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: spruceUI/spruceOS
          ref: ${{ env.SPRUCE_COMMIT }}
          path: spruceOS
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            App/PyUI/dll-mali/
            App/PortMaster/portmaster.7z
            spruce/smartpro/bin/bash
            spruce/h700/lib64/sdl2/

      - name: Check ScreenScraper's key
        env:
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: |
          set -eu
          # A key ScreenScraper turns away would only show on a console, as Cart Labels saying
          # it refused this build. A tag goes out to players, so it stops here without a key; a
          # build by hand only warns. A ScreenScraper that cannot be asked holds nothing up.
          if [ -z "$OMEGA_SS_DEVID" ] || [ -z "$OMEGA_SS_DEVPASSWORD" ]; then
            case "$GITHUB_REF" in
            refs/tags/*)
              echo "::error::OMEGA_SS_DEVID and OMEGA_SS_DEVPASSWORD must both be set to release"
              exit 1
              ;;
            esac
            echo "::warning::No ScreenScraper key: Cart Labels will say it cannot reach ScreenScraper"
            exit 0
          fi
          reply="$RUNNER_TEMP/screenscraper-reply"
          rm -f "$reply"
          status=0
          # the softname label_sync.rs sends
          code="$(curl -s -m 30 --retry 2 -A "Emellie Slot" -o "$reply" -w '%{http_code}' -G \
            https://api.screenscraper.fr/api2/ssinfraInfos.php \
            --data-urlencode "devid=$OMEGA_SS_DEVID" \
            --data-urlencode "devpassword=$OMEGA_SS_DEVPASSWORD" \
            --data-urlencode "softname=Emellie Slot" -d output=json)" || status=$?
          if [ "$code" = 403 ] || grep -qs 'Erreur de login' "$reply"; then
            echo "::error::ScreenScraper refused OMEGA_SS_DEVID and OMEGA_SS_DEVPASSWORD"
            exit 1
          fi
          if [ "$code" != 200 ]; then
            echo "::warning::Could not check ScreenScraper's key (HTTP $code, curl $status)"
          fi

      - name: Install zip, cmake, 7-Zip and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake p7zip-full file binutils
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Name the tree
        # after the tag or branch, its slashes made dashes: an artifact's name takes none
        run: echo "TREE=emellie-slot-$(printf %s "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"

      - name: Build the tree
        env:
          # ScreenScraper's key for Emellie Slot, for the Cart Labels screen. Without it the
          # screen says the build cannot reach ScreenScraper.
          OMEGA_SS_DEVID: ${{ secrets.OMEGA_SS_DEVID }}
          OMEGA_SS_DEVPASSWORD: ${{ secrets.OMEGA_SS_DEVPASSWORD }}
        run: task dist:device OUT="$TREE" SPRUCE="$GITHUB_WORKSPACE/spruceOS"

      - name: Check what is about to ship
        run: |
          set -eu
          out="$TREE"
          file "$out/System/emellie-slot" | grep -q aarch64
          test -x "$out/System/emellie-slot"
          # each core an aarch64 library a frontend can open: retro_init and retro_run exported
          for lib in mgba armgba snes9x mednafen_supafaust pcsx_rearmed gambatte picodrive \
            genesis_plus_gx fceumm nestopia; do
            so="$out/System/${lib}_libretro.so"
            file "$so" | grep -q aarch64
            nm -D --defined-only "$so" | grep -qw retro_init
            nm -D --defined-only "$so" | grep -qw retro_run
          done
          file "$out/System/dsperate/dsperate" | grep -q aarch64
          test -f "$out/System/dsperate/lib/libSDL2-2.0.so.0"
          test -f "$out/System/ports/portmaster.7z"
          test -f "$out/System/pico8/libsdl_sensor_shim.so"
          for size in 640x480 720x480 720x720; do
            test -f "$out/System/bootlogo-$size.bmp"
          done
          for script in launch_frontend.sh probe.sh wifi.sh bluetooth.sh lid.sh nds.sh ports.sh \
            pico8.sh; do
            test -f "$out/System/$script"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done
          # every core built from source ships its source, build stamp and patches beside it
          for name in armgba snes9x supafaust pcsx_rearmed gambatte-libretro picodrive \
            Genesis-Plus-GX libretro-fceumm nestopia DSperate; do
            src_sha="$(cat "vendor/$name-src.sha")"
            test -f "$out/System/licenses/$name-${src_sha}.tar.gz"
            test -f "$out/System/licenses/$name-${src_sha}.meta"
          done
          for licence in armgba-GPL-2.0 snes9x-non-commercial snes9x-snes_ntsc-LGPL-2.1 \
            supafaust-GPL-2.0 pcsx_rearmed-GPL-2.0 gambatte-GPL-2.0 picodrive-non-commercial \
            genesis_plus_gx-non-commercial fceumm-GPL-2.0 nestopia-GPL-2.0 DSperate-GPL-3.0; do
            test -f "$out/System/licenses/$licence.txt"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="$TREE"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Emellie Slot, a personal fork of [omega-zero](https://github.com/oauramos/omega-zero), for Anbernic H700 handhelds running [BaseOS](https://github.com/pvaibhav/BaseOS): made for the RG35XX SP and the RG CubeXX. Other BaseOS devices are untested.

          Unzip and copy the contents of \`emellie-slot-${GITHUB_REF_NAME}/\` to the root of the BaseOS card. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) and the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          Emulation by armGBA (GPL-2.0) and mGBA (MPL-2.0) for the GBA, Gambatte (GPL-2.0) for the Game Boys, Snes9x (free for non-commercial use only) and Supafaust (GPL-2.0) for the SNES, PCSX ReARMed (GPL-2.0) for the PlayStation, PicoDrive and Genesis Plus GX (non-commercial) for the Mega Drive, FCEUmm and Nestopia (GPL-2.0) for the NES, and DSperate (GPL-3.0) for the DS. Their licences, patches and source (mGBA's aside) are in \`System/licenses/\`. Emellie Slot is free software under the GPL-3.0-or-later; its credits are in the README.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "Emellie Slot $GITHUB_REF_NAME" --notes-file notes.md

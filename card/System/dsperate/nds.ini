# DSperate's settings for DS games played from omega-zero, seeded once into
# Config/dsperate/nds-<pad>.ini by System/nds.sh with the card's paths written in. The
# pause menu (MENU) saves changes back to that copy; delete it to start over.
# Every key DSperate knows is in its own configs/default.ini.

[paths]
# Dumps are optional: without them a built-in BIOS and a generated firmware run games.
bios9 = @SD@/BIOS/nds/bios9.bin
bios7 = @SD@/BIOS/nds/bios7.bin
firmware = @SD@/BIOS/nds/firmware.bin
games = @SD@/Games/NDS
saves = @SD@/Saves/NDS
states = @SD@/States/NDS
screenshots = @SD@/Screenshots
cache = @SD@/Config/dsperate/cache
cheats = @SD@/BIOS/nds/usrcheat.dat

[video]
fullscreen = true
layout = vertical
pip_alpha = 0.67

[audio]
driver = alsa
mic = false

[emu]
# Resume where the game was left, as omega-zero does for its own games.
autosave = true
autoload = true
frameskip = 1

[pad]
# How the stylus is worked, from pad-nostick.ini, pad-1stick.ini or pad-2stick.ini by the
# handheld's sticks: System/nds.sh seeds one of these files for each kind of pad, so a card
# moved between an RG35XX SP and an RG CubeXX keeps the settings of each.
@PAD@
face_fix = off

[hotkeys]
quit = none

[padhotkeys]
# MENU is the modifier; these are the player's own, as they bound them in DSperate's menu on an
# RG35XX SP. System/nds.sh puts this section and [hotkeys] back in their settings at every start.
modifier = guide
pause = mod+start
quit = mod+select
save_state = none
load_state = none
fast_forward = none
fast_forward_toggle = mod+rightshoulder
layout_next = none
layout_prev = none
screen_swap = +lefttrigger
slot_next = none
slot_prev = none
screenshot = none
mic = mod+a
lid = mod+y
fps = none
# The d-pad moves the stylus until pressed again (cores/dsperate/emellie-hotkeys.patch)
stylus_toggle = mod+x

[cheevos]
enabled = false

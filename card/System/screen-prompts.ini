# Screen prompts: a box that offers to save a state when a game's password screen comes up,
# and to load that state again on its title screen. Copy this file to Config/screen-prompts.ini
# to change it: the copy in Config is read first and an update leaves it alone.
#
#   [Any name]
#   system = MD                  (GBA, GB, GBC, FC, SNES, MD or PS1; leave out for any)
#   match  = part of the file name | another part
#   save   = conditions that are true on the password screen
#   load   = conditions that are true on the title screen
#
# Conditions are RetroAchievements memory conditions joined by _ (all must hold), with the
# addresses its code notes give: 0xH = 8 bits, 0x = 16 bits, 0xX = 32 bits, compared with
# = != < <= > >= to a decimal or hex (0x1f or h1f) number. A key written again is another
# way for that screen to show.
#
#   trace  = 0xH9002 0xH9004     (addresses whose every change goes to emellie-slot.log,
#                                 to find a screen's values; takes a little time each frame)

# Castlevania: Bloodlines (RetroAchievements game 69). 0x9002 is its screen mode:
# 0 Sega logo, 1 intro, 2 press start, 3 demo, 4 main menu, 5 options,
# 6 character select, 7 password ENTRY screen, 8 stage start, 9 in game.
# 0x9004 counts up while a screen fades in and stays 0 in play; after a stage is beaten the
# mode stays 9 and 0x9004 climbs to 7 on the password screen it shows (traced on an SP,
# es-1.0.21, Castlevania - Bloodlines (USA)).
[Castlevania: Bloodlines]
system = MD
match = castlevania bloodlines | vampire killer | castlevania the new generation
save = 0xH9002=9_0xH9004=7
load = 0xH9002=2
# Screen mode, sub-mode, stage, lives: to find the password shown after a stage.
trace = 0xH9002 0xH9004 0xHfb2c 0xHfb2e

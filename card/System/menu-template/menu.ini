# Ajustes del tema del menú (main menu y grid de consolas).
# Una línea "clave = valor"; las que empiezan con # no cuentan. Lo que no pongas usa el valor
# por defecto, que es el que aparece aquí. Ver README.md.

# Columnas y filas del grid de consolas. Si hay más consolas que celdas, el grid pasa de página.
# grid_columns = 4
# grid_rows = 2

# Tamaño en píxeles de los nombres bajo los íconos, en el grid y en el menú principal.
# grid_text_size = 18
# home_text_size = 21

# Color de los nombres, y el del elegido (#RRGGBB).
# text_colour = #7C6F64
# text_lit_colour = #FBF1C7

# Escribir el nombre bajo cada ícono: yes o no.
# names = yes

# El marco detrás de la consola elegida en el grid: frame.png, o "none" para no dibujar nada.
# frame = frame.png

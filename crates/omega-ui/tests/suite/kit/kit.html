<!doctype html>
<!--
  The kit's components one at a time, at one CSS pixel to an art pixel, on nothing: what
  make-refs.sh screenshots into ref/ for kit.rs to hold the Rust faces to, pixel for pixel.

    kit.html?c=modal&w=200&h=120
    kit.html?c=panel&w=160&h=60&label=CONFIGS&active
    kit.html?c=action-left&label=RETURN&hint=B
    kit.html?c=action-left&label=RETURN&hint=B&u=2       at 2px an art pixel, as on the device
    kit.html?c=action-left&label=RETURN&hint=B&smooth    with macOS's font smoothing left on
    kit.html?c=action-left&label=RETURN&hint=B&room=54%2030   as wide as CONFIRM beside it
    kit.html?c=action-left&label=RETURN&hint=B&font=thin      in the thin font
    kit.html?c=row&w=150&label=FAST%20FORWARD&value=6X&lit&carets
    kit.html?c=list-row&w=150&label=Home&value=CONNECTED&signal=3&lock&lit
    kit.html?c=list-row&w=150&label=Keychron%20K3&device=keyboard
    kit.html?c=bar&w=320&left=RETURN&left-hint=B&right=CONFIRM&right-hint=A&hint=Y%20FORGET
    kit.html?c=text&tone=dim&text=SFTP%20uses%20the%20same%20login
    kit.html?c=saves&age=4%20min%20ago&count=4&at=1      the save-state switcher's panel
    kit.html?c=flow&screen=ssh                           a panel as flow.html builds it
    kit.html?c=gauge&label=VOLUME&value=55&max=100&cells=20&icon=volume
    kit.html?c=hints&label=SAVE&hint=Y%20DELETE%20%7C%20X%20UNDO%20SAVE&w=180   held 180 wide
    kit.html?c=toast&label=SAVE%20STATE&text=State%20saved
    kit.html?c=badge&icon=fastforward&text=%C3%974&lit
    kit.html?c=link&piece=plug&role=join                 a piece of the link screen's art

  An action takes its label, font, hint and room. row and list-row take omega-row's and
  omega-list-row's attributes, bar omega-bar's hint and font and its two actions' words and hints
  (a side left out is the empty action), saves omega-saves's and a width w to hold it to. text is
  a line of Pixel Code as flow.html sets a panel's notes and the Controls panel's columns, in the
  --oz-<tone> colour, a newline in it a <br>, and ◀ ▶ ▲ ▼ … drawn as flow/art.js's glyphs, as
  flow.html draws them (the web font has none). flow is one of flow.html's lone panels, its markup
  copied here (ssh, labels, controls) and drawn with flow/flow.css. gauge, toast and badge take
  omega-gauge's, omega-toast's and omega-badge's attributes, hints omega-hints's and a width w to
  hold it to.

  The colours are palette.js's RAMP as written, set straight on the page, so the faces and the
  screenshots are drawn in exactly the same ones whatever palette.js makes of a backdrop colour.

  macOS smooths DOM text (CoreText font smoothing), ringing each glyph of a hint or a title with
  a faint halo, at most about a quarter of the ink over the pixels round it; a canvas word never
  gets one. The page turns it off unless asked, so text lands on whole pixels as the faces draw
  it; the ink itself is the same either way.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../../assets/ui/foundation/fonts.css">
<link rel="stylesheet" href="../../../../../assets/ui/foundation/tokens.css">
<script src="../../../../../assets/ui/foundation/pixel.js"></script>
<script src="../../../../../assets/ui/foundation/backdrop.js"></script>
<script src="../../../../../assets/ui/foundation/palette.js"></script>
<script src="../../../../../assets/ui/components/omega-modal.js"></script>
<script src="../../../../../assets/ui/components/omega-panel.js"></script>
<script src="../../../../../assets/ui/components/omega-row.js"></script>
<script src="../../../../../assets/ui/components/omega-list-row.js"></script>
<script src="../../../../../assets/ui/components/action-left.js"></script>
<script src="../../../../../assets/ui/components/action-right.js"></script>
<script src="../../../../../assets/ui/components/omega-bar.js"></script>
<script src="../../../../../assets/ui/components/omega-gauge.js"></script>
<script src="../../../../../assets/ui/components/omega-hints.js"></script>
<script src="../../../../../assets/ui/components/omega-toast.js"></script>
<script src="../../../../../assets/ui/components/omega-badge.js"></script>
<script src="../../../../../assets/ui/components/omega-saves.js"></script>
<script src="../../../../../assets/ui/components/omega-link.js"></script>
<script src="../../../../../assets/ui/flow/art.js"></script>
<style>
  :root { --u: 1px; }
  html, body { margin: 0; background: transparent; }
  #kit {
    position: absolute; left: 0; top: 0;
    -webkit-font-smoothing: var(--smoothing, antialiased);
    --oz-dark: #2a0f04; --oz-edge: #6a3d01; --oz-well: #4f300d; --oz-plate: #765020;
    --oz-tab: #845a1a; --oz-band: #a57221; --oz-stripe: #b0731b; --oz-dim: #be9732;
    --oz-frame: #e6ab47; --oz-frame-hi: #f8b83f; --oz-label: #f2c87d; --oz-cream: #f5e5bb;
  }
  /* an action's notch rises above it, so it (and a bar of them) stands that far down the page */
  #kit.action { top: calc(4 * var(--u)); }
  /* a line set as a note in a panel's well is: Pixel Code on a line of 10, drawn without the
     browser's hinting (omega-panel's text-rendering, which what is in it inherits) */
  .line {
    font: 400 calc(9 * var(--u)) / calc(10 * var(--u)) var(--oz-font);
    text-rendering: geometricPrecision;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="kit"></div>

<!-- flow.html's lone panels, as it has them (#screen=ssh, labels, controls). SSH's three ways
     are one each here, its rows straight in the panel: flow.html keeps them in a div it shows
     or hides, where omega-panel's ::slotted rule cannot reach them, so there they miss the
     pixel every row reaches into a well's sides (its network list, .list, reaches it itself). -->
<template id="flow-ssh">
  <omega-panel label="SSH" active class="lone small info">
    <omega-row label="IP" value="192.168.1.20"></omega-row>
    <omega-row label="HOST" value="rg35xxsp.local"></omega-row>
    <omega-row label="USER" value="root"></omega-row>
    <omega-row label="PASSWORD" value="482913"></omega-row>
    <omega-row label="PORT" value="22"></omega-row>
    <p class="note">SFTP uses the same login</p>
  </omega-panel>
</template>
<template id="flow-ssh-offline">
  <omega-panel label="SSH" active class="lone small info offline">
    <p class="note">Join a Wi-Fi network first.</p>
  </omega-panel>
</template>
<template id="flow-ssh-switched-off">
  <omega-panel label="SSH" active class="lone small info offline">
    <p class="note">Turn SSH on first.</p>
  </omega-panel>
</template>
<template id="flow-labels">
  <omega-panel label="LABELS" active class="lone labels-panel">
    <omega-row label="SCREENSCRAPER" value="SIGN IN" lit></omega-row>
    <omega-row label="FETCH LABELS"></omega-row>
    <p class="note">Sign in with your free ScreenScraper account<br>to fetch the real labels of your carts.</p>
  </omega-panel>
</template>
<template id="flow-controls">
  <omega-panel label="CONTROLS" active class="lone controls-panel">
    <div class="columns">
      <div class="keymap" style="--keys: 6; --does: 11">
        <h3>SHELF</h3>
        <span class="k">A</span><span>PLAY</span>
        <span class="k">HOLD A</span><span>CLEAN START</span>
        <span class="k">X</span><span>CORE</span>
        <span class="k">START</span><span>SETTINGS</span>
        <span class="k">SELECT</span><span>CONTROLS</span>
        <span class="k"><i class="g left"></i><i class="g right"></i></span><span>BROWSE</span>
        <span class="k"><i class="g up"></i><i class="g down"></i></span><span>LETTER</span>
        <span class="k">L1 R1</span><span>SHELF</span>
      </div>
      <div class="keymap" style="--keys: 12; --does: 15">
        <h3>IN GAME</h3>
        <span class="k">L2</span><span>REWIND</span>
        <span class="k">R2</span><span>FAST FORWARD</span>
        <span class="k">MENU ×2</span><span>SAVE STATES</span>
        <span class="k">HOLD MENU</span><span>EJECT</span>
        <span class="k">SELECT+MENU</span><span>LINK</span>
        <span class="k">SELECT+<i class="g up"></i><i class="g down"></i></span><span>BRIGHTNESS</span>
        <span class="k">SELECT+<i class="g left"></i><i class="g right"></i></span><span>SUNLIGHT</span>
        <span class="k">SELECT+L1/R1</span><span>LOAD/SAVE STATE</span>
        <span class="k">SELECT+Y</span><span>COLOUR</span>
        <span class="k">VOL+ VOL-</span><span>MUTE</span>
        <span class="k">HOLD POWER</span><span>POWER MENU</span>
      </div>
    </div>
  </omega-panel>
</template>

<script>
  const q = new URLSearchParams(location.search);
  const kit = document.getElementById('kit');
  const c = q.get('c');
  if (q.has('u')) document.documentElement.style.setProperty('--u', `${q.get('u')}px`);
  if (q.has('smooth')) kit.style.setProperty('--smoothing', 'auto');
  const size = el => {
    el.style.width = `calc(${q.get('w')} * var(--u))`;
    el.style.height = `calc(${q.get('h')} * var(--u))`;
  };
  // the query's attributes on `el`: those with a value as given, the rest present or not
  const attrs = (el, valued, flags) => {
    for (const name of valued) if (q.get(name)) el.setAttribute(name, q.get(name));
    for (const name of flags) if (q.has(name)) el.setAttribute(name, '');
  };
  // flow/flow.css, ahead of this page's own styles so they still win (the page stays clear)
  const flowStyles = () => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '../../../../../assets/ui/flow/flow.css';
    document.head.insertBefore(link, document.querySelector('style'));
    FlowArt.paint(kit);
  };
  const GLYPHS = { '◀': 'left', '▶': 'right', '▲': 'up', '▼': 'down', '…': 'ellipsis' };

  if (c === 'modal') {
    const modal = document.createElement('omega-modal');
    size(modal);
    // weights=1,1 fills it with panels that share its height by those flex-grows
    for (const [i, grow] of (q.get('weights') ?? '').split(',').filter(Boolean).entries()) {
      const panel = document.createElement('omega-panel');
      panel.setAttribute('label', i ? 'ATTACK MODE' : 'BUTTON SETTING');
      if (!i) panel.setAttribute('active', '');
      panel.style.flexGrow = grow;
      modal.append(panel);
    }
    kit.append(modal);
  } else if (c === 'panel') {
    const panel = document.createElement('omega-panel');
    size(panel);
    panel.setAttribute('label', q.get('label') ?? '');
    if (q.has('active')) panel.setAttribute('active', '');
    kit.append(panel);
  } else if (c === 'row' || c === 'list-row') {
    const row = document.createElement(`omega-${c}`);
    row.style.width = `calc(${q.get('w')} * var(--u))`;
    attrs(row, ['label', 'value', 'signal', 'device'], ['lit', 'carets', 'opens', 'dim', 'lock']);
    kit.append(row);
  } else if (c === 'bar') {
    kit.className = 'action';
    kit.style.width = `calc(${q.get('w')} * var(--u))`;
    const bar = document.createElement('omega-bar');
    attrs(bar, ['hint', 'font'], []);
    for (const side of ['left', 'right']) {
      const action = document.createElement(`action-${side}`);
      action.slot = side;
      if (q.get(side)) action.setAttribute('label', q.get(side));
      if (q.get(`${side}-hint`)) action.setAttribute('hint', q.get(`${side}-hint`));
      bar.append(action);
    }
    kit.append(bar);
  } else if (c === 'saves') {
    const saves = document.createElement('omega-saves');
    // inline-flex stands on a line's baseline: put it at the line's top, the page's
    saves.style.verticalAlign = 'top';
    if (q.get('w')) saves.style.width = `calc(${q.get('w')} * var(--u))`;
    attrs(saves, ['label', 'age', 'count', 'at'], []);
    kit.append(saves);
  } else if (c === 'text') {
    flowStyles();
    const line = document.createElement('div');
    line.className = 'line';
    line.style.color = `var(--oz-${q.get('tone') ?? 'cream'})`;
    for (const [i, text] of (q.get('text') ?? '').split('\n').entries()) {
      if (i) line.append(document.createElement('br'));
      for (const ch of text) {
        if (!GLYPHS[ch]) { line.append(ch); continue; }
        const glyph = document.createElement('i');
        glyph.className = `g ${GLYPHS[ch]}`;
        line.append(glyph);
      }
    }
    kit.append(line);
  } else if (c === 'gauge' || c === 'toast' || c === 'badge' || c === 'hints') {
    // a flex item, so the inline element stands at the top left and not on a line's baseline
    kit.style.display = 'flex';
    const el = document.createElement(`omega-${c}`);
    attrs(el, ['label', 'value', 'max', 'cells', 'icon', 'text', 'hint'], ['lit']);
    if (q.get('w')) el.style.width = `calc(${q.get('w')} * var(--u))`;
    kit.append(el);
  } else if (c === 'link') {
    const link = document.createElement('omega-link');
    attrs(link, ['piece', 'role', 'length', 'width', 'height', 'ring', 'side'], []);
    kit.append(link);
  } else if (c === 'flow') {
    flowStyles();
    kit.append(document.getElementById(`flow-${q.get('screen')}`).content.cloneNode(true));
  } else {
    kit.className = 'action';
    const action = document.createElement(c);
    attrs(action, ['label', 'font', 'hint', 'room'], []);
    kit.append(action);
  }
</script>
</body>
</html>

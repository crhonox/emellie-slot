[package]
name = "omega-zero"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# the program on the card is System/emellie-slot; the crate keeps omega-zero's name
autobins = false

[[bin]]
name = "emellie-slot"
path = "src/main.rs"

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "omega-gfx/host"]
device = ["omega-gfx/device"]

[dependencies]
omega-gfx = { path = "../omega-gfx", default-features = false }
omega-input = { path = "../omega-input" }
omega-power = { path = "../omega-power" }
omega-retro = { path = "../omega-retro" }
omega-store = { path = "../omega-store" }
omega-ui = { path = "../omega-ui" }
omega-cheevos = { path = "../omega-cheevos" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }

[dev-dependencies]
omega-gfx = { path = "../omega-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
